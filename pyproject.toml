[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeupfinder"
# Lue dans `tradeupfinder.__version__` : un seul endroit a changer a chaque
# release, deux copies finissent par diverger (0.1.0 ici face a une 1.0.1
# publiee).
dynamic = ["version"]
description = "Aide a la decision pour les trade-up contracts CS2 : EV nette et variance"
requires-python = ">=3.11"
dependencies = []  # noyau sans dependance : stdlib uniquement

[project.optional-dependencies]
# pyflakes lit le paquet sans l'executer : il attrape les imports
# manquants dans une commande que les tests n'appellent pas.
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
tradeupfinder = "tradeupfinder.cli:main"
tradeupfinder-web = "tradeupfinder.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tradeupfinder.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
