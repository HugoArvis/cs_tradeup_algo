[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-tradeup-algo"
version = "0.1.0"
description = "Aide a la decision pour les trade-up contracts CS2 : EV nette et variance"
requires-python = ">=3.11"
dependencies = []  # noyau sans dependance : stdlib uniquement

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradeup = "tradeup.cli:main"
tradeup-web = "tradeup.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
